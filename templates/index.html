<!DOCTYPE html>
<html>

<head>

<title>Phishing Email Detector</title>

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
}

.container{
width:80%;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:90%;
height:120px;
padding:10px;
}

button{
background:#007bff;
color:white;
border:none;
padding:10px 20px;
cursor:pointer;
}

.graph{
margin-top:40px;
}

</style>

</head>

<body>

<div class="container">

<h1>📧 Phishing Email Detection System</h1>

<form method="POST">

<textarea name="email" placeholder="Paste email here"></textarea>

<br><br>

<button type="submit">Check Email</button>

</form>

{% if result %}

<h2>Prediction : {{result.prediction}}</h2>

<h3>Confidence : {{result.confidence}}</h3>

{% endif %}

<h3>Model Accuracy : {{accuracy}}</h3>

<div id="graph1" class="graph"></div>
<div id="graph2" class="graph"></div>
<div id="graph3" class="graph"></div>

<h2>Email Word Cloud</h2>

<img src="data:image/png;base64,{{wordcloud_img}}" width="600">

</div>

<script>

var graph1 = JSON.parse('{{graphJSON1 | safe}}');
var graph2 = JSON.parse('{{graphJSON2 | safe}}');
var graph3 = JSON.parse('{{graphJSON3 | safe}}');

Plotly.newPlot("graph1",graph1.data,graph1.layout);
Plotly.newPlot("graph2",graph2.data,graph2.layout);
Plotly.newPlot("graph3",graph3.data,graph3.layout);

</script>

</body>
</html>
